<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks · Done filter, empty</title>
<meta name="description" content="&quot;Nothing completed yet.&quot;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/app.css">
<script src="../app.js"></script>
</head>
<body>
<main class="app">
<header class="head">
  <div>
    <h1 class="head__day" data-today="weekday">Wednesday</h1>
    <p class="head__date" data-today="date">7 October</p>
  </div>
  <div class="progress">
    <div class="progress__text">
      <span class="progress__num">3</span>
      <span class="progress__label">left</span>
    </div>
    <div class="ring-wrap" aria-hidden="true">
      <svg class="ring" viewBox="0 0 48 48"><circle class="ring__track" cx="24" cy="24" r="20"/><circle class="ring__fill" cx="24" cy="24" r="20" data-progress="0.000"/></svg>
      <svg class="ring__done" viewBox="0 0 20 20"><path d="M4 10.5l4 4L16 6"/></svg>
    </div>
  </div>
</header>

<section class="card" aria-label="Tasks">
<form class="composer" novalidate>
  <div class="composer__field">
    <label class="sr-only" for="newTask">New task</label>
    <input class="composer__input" id="newTask" name="title" type="text" maxlength="200" placeholder="What needs doing?" autocomplete="off" value="" aria-describedby="newTaskError">
    <span class="composer__count" hidden>0/200</span>
  </div>
  <button class="composer__btn" type="submit" aria-label="Add task"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add task</span></button>
</form>
<p class="composer__error" id="newTaskError" role="alert" hidden></p>
<div class="toolbar">
  <div class="seg" role="group" aria-label="Show tasks" data-selected="done">
    <span class="seg__pill" aria-hidden="true"></span>
    <button class="seg__btn" type="button" aria-pressed="false" aria-label="All, 3">All <span class="seg__n">3</span></button>
    <button class="seg__btn" type="button" aria-pressed="false" aria-label="Active, 3">Active <span class="seg__n">3</span></button>
    <button class="seg__btn" type="button" aria-pressed="true" aria-label="Done, 0">Done <span class="seg__n">0</span></button>
  </div>
  <button class="link-btn" type="button" aria-disabled="true">Clear completed</button>
</div>
<div class="state">
  <svg class="state__art" viewBox="0 0 88 88" aria-hidden="true">
      <circle class="a" cx="44" cy="46" r="38"/>
      <circle class="b b--quiet" cx="44" cy="46" r="16"/>
  </svg>
  <h2 class="state__title">Nothing completed yet</h2>
  <p class="state__text">Tick a task and it will show up here.</p>
</div>
</section>
<aside class="mock" aria-label="Mock notes">
  <p><strong>Mock</strong> · L2-008.4, L2-017.2, L2-017.5 · <a href="../index.html">All mocks</a></p>
  <p>URL: <code>/?filter=done</code>. Also what remains after Clear completed on this filter. Clear completed is <code>aria-disabled</code>.</p>
</aside>
</main>
<div class="sr-only" aria-live="polite"></div>
</body>
</html>
