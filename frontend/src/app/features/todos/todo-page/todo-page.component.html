<main class="app">
  <app-todo-header
    [date]="today"
    [activeCount]="store.activeCount()"
    [completedCount]="store.completedCount()"
  />
  <section class="card" [attr.aria-label]="strings.list.label">
    <app-todo-composer
      [focusRequest]="composerFocus()"
      [restore]="composerRestore()"
      (submitted)="onAdd($event)"
    />

    <div class="toolbar">
      <app-todo-filter
        [selected]="store.filter()"
        [allCount]="store.totalCount()"
        [activeCount]="store.activeCount()"
        [doneCount]="store.completedCount()"
        (selectedChange)="select($event)"
      />
    </div>

    @if (store.loadFailed()) {
      <div class="banner" role="alert">
        <p class="banner__text">{{ strings.list.loadFailed }}</p>
        <button class="banner__btn" type="button" (click)="store.reload()">
          {{ strings.list.retry }}
        </button>
      </div>
    } @else {
      <app-todo-list
        [todos]="store.visibleTodos()"
        [loading]="store.loading()"
        [editingId]="store.editingId()"
        (toggled)="onToggled($event.id, $event.completed)"
        (editStarted)="store.beginEdit($event)"
        (titleSaved)="onTitleSaved($event.id, $event.title)"
        (editCancelled)="store.cancelEdit()"
      />
      @if (!store.loading() && store.visibleTodos().length === 0) {
        <app-todo-empty-state [kind]="emptyKind()" />
      }
    }
  </section>
</main>
<div class="toasts">
  @if (store.toast(); as toast) {
    <app-toast [toast]="toast" />
  }
</div>
