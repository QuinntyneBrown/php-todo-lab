<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks · Long titles</title>
<meta name="description" content="200 characters, emoji, CJK and URLs wrap cleanly">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/app.css">
<script src="../app.js"></script>
</head>
<body>
<main class="app">
<header class="head">
  <div>
    <h1 class="head__day" data-today="weekday">Wednesday</h1>
    <p class="head__date" data-today="date">7 October</p>
  </div>
  <div class="progress">
    <div class="progress__text">
      <span class="progress__num">3</span>
      <span class="progress__label">left</span>
    </div>
    <div class="ring-wrap" aria-hidden="true">
      <svg class="ring" viewBox="0 0 48 48"><circle class="ring__track" cx="24" cy="24" r="20"/><circle class="ring__fill" cx="24" cy="24" r="20" data-progress="0.250"/></svg>
      <svg class="ring__done" viewBox="0 0 20 20"><path d="M4 10.5l4 4L16 6"/></svg>
    </div>
  </div>
</header>

<section class="card" aria-label="Tasks">
<form class="composer" novalidate>
  <div class="composer__field">
    <label class="sr-only" for="newTask">New task</label>
    <input class="composer__input" id="newTask" name="title" type="text" maxlength="200" placeholder="What needs doing?" autocomplete="off" value="" aria-describedby="newTaskError">
    <span class="composer__count" hidden>0/200</span>
  </div>
  <button class="composer__btn" type="submit" aria-label="Add task"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add task</span></button>
</form>
<p class="composer__error" id="newTaskError" role="alert" hidden></p>
<div class="toolbar">
  <div class="seg" role="group" aria-label="Show tasks" data-selected="all">
    <span class="seg__pill" aria-hidden="true"></span>
    <button class="seg__btn" type="button" aria-pressed="true" aria-label="All, 4">All <span class="seg__n">4</span></button>
    <button class="seg__btn" type="button" aria-pressed="false" aria-label="Active, 3">Active <span class="seg__n">3</span></button>
    <button class="seg__btn" type="button" aria-pressed="false" aria-label="Done, 1">Done <span class="seg__n">1</span></button>
  </div>
  <button class="link-btn" type="button" aria-disabled="false">Clear completed</button>
</div>
<ul class="list">
<li class="item">
  <label class="check"><input class="check__input" type="checkbox" aria-label="Call the building manager about the leaking radiator in the spare room, ask whether the plumber can come before the twentieth, and confirm who pays for the parts if the valve has to be replaced again."><span class="check__box"><svg class="check__tick" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.5l3.2 3.2L12 3.5"/></svg></span></label>
  <div class="title"><button class="title__btn" type="button" aria-label="Edit Call the building manager about the leaking radiator in the spare room, ask whether the plumber can come before the twentieth, and confirm who pays for the parts if the valve has to be replaced again.">Call the building manager about the leaking radiator in the spare room, ask whether the plumber can come before the twentieth, and confirm who pays for the parts if the valve has to be replaced again.</button></div>
  <button class="del" type="button" aria-label="Delete Call the building manager about the leaking radiator in the spare room, ask whether the plumber can come before the twentieth, and confirm who pays for the parts if the valve has to be replaced again."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg></button>
</li>
<li class="item">
  <label class="check"><input class="check__input" type="checkbox" aria-label="Pack for the beach 🏖️ sunscreen ☀️ towels 🧺 snacks 🍉"><span class="check__box"><svg class="check__tick" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.5l3.2 3.2L12 3.5"/></svg></span></label>
  <div class="title"><button class="title__btn" type="button" aria-label="Edit Pack for the beach 🏖️ sunscreen ☀️ towels 🧺 snacks 🍉">Pack for the beach 🏖️ sunscreen ☀️ towels 🧺 snacks 🍉</button></div>
  <button class="del" type="button" aria-label="Delete Pack for the beach 🏖️ sunscreen ☀️ towels 🧺 snacks 🍉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg></button>
</li>
<li class="item is-done">
  <label class="check"><input class="check__input" type="checkbox" checked aria-label="買い物リスト：牛乳、卵、パン、りんごを買う"><span class="check__box"><svg class="check__tick" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.5l3.2 3.2L12 3.5"/></svg></span></label>
  <div class="title"><button class="title__btn" type="button" aria-label="Edit 買い物リスト：牛乳、卵、パン、りんごを買う">買い物リスト：牛乳、卵、パン、りんごを買う</button></div>
  <button class="del" type="button" aria-label="Delete 買い物リスト：牛乳、卵、パン、りんごを買う"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg></button>
</li>
<li class="item">
  <label class="check"><input class="check__input" type="checkbox" aria-label="Read https://example.com/guides/a-really-long-path-without-any-spaces-to-check-wrapping-on-small-screens"><span class="check__box"><svg class="check__tick" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.5l3.2 3.2L12 3.5"/></svg></span></label>
  <div class="title"><button class="title__btn" type="button" aria-label="Edit Read https://example.com/guides/a-really-long-path-without-any-spaces-to-check-wrapping-on-small-screens">Read https://example.com/guides/a-really-long-path-without-any-spaces-to-check-wrapping-on-small-screens</button></div>
  <button class="del" type="button" aria-label="Delete Read https://example.com/guides/a-really-long-path-without-any-spaces-to-check-wrapping-on-small-screens"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg></button>
</li>
</ul>
</section>
<aside class="mock" aria-label="Mock notes">
  <p><strong>Mock</strong> · L2-027.6, L2-002.5, L2-021.3 · <a href="../index.html">All mocks</a></p>
  <p>Best viewed at 320 px. Titles wrap and the row grows; the checkbox and delete never overlap the text.</p>
</aside>
</main>
<div class="sr-only" aria-live="polite"></div>
</body>
</html>
