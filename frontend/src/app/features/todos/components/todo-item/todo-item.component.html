<div
  class="item"
  [class.item--done]="todo().completed"
  [class.item--celebrate]="celebrating() && todo().completed"
  [class.item--pending]="todo().pending"
  [class.item--enter]="todo().pending"
>
  <label class="check">
    <input
      #checkbox
      class="check__input"
      type="checkbox"
      [checked]="todo().completed"
      [disabled]="todo().pending"
      [attr.aria-label]="todo().title"
      (change)="onChange($event)"
    />
    <span class="check__box">
      <svg class="check__tick" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M2 7.5l3.2 3.2L12 3.5" />
      </svg>
    </span>
  </label>
  <div class="title">
    @if (editing()) {
      <input
        #editor
        class="edit"
        type="text"
        [value]="todo().title"
        [attr.aria-label]="strings.item.editLabel"
        [attr.aria-invalid]="editError() === null ? null : 'true'"
        [attr.aria-describedby]="editError() === null ? null : 'edit-error-' + todo().id"
        (keydown)="onEditKey($event)"
        (blur)="onEditBlur($event)"
      />
      @if (editError(); as message) {
        <p class="edit__msg" role="alert" [id]="'edit-error-' + todo().id">{{ message }}</p>
      }
    } @else {
      <button
        #titleButton
        class="title__btn"
        type="button"
        [disabled]="todo().pending"
        [attr.aria-label]="strings.ariaLabels.edit(todo().title)"
        (click)="startEdit()"
      >
        {{ todo().title }}
      </button>
    }
  </div>
  <button
    class="del"
    type="button"
    [disabled]="todo().pending"
    [attr.aria-label]="strings.ariaLabels.delete(todo().title)"
    (click)="onDelete($event)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3" />
    </svg>
  </button>
</div>
